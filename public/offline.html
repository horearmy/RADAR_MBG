<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#061b41" />
    <title>RADAR MBG - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #21334a; background: #f5f7fa; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #e2eaf3; border-radius: 16px; background: #fff; box-shadow: 0 18px 50px rgb(16 33 52 / 8%); text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 22px; color: #061b41; font-size: 14px; font-weight: 800; letter-spacing: .04em; }
      .mark { display: inline-flex; align-items: flex-end; gap: 3px; height: 20px; }
      .mark span { width: 5px; border-radius: 2px; background: #2f6fae; }
      .mark span:nth-child(1) { height: 10px; }
      .mark span:nth-child(2) { height: 16px; background: #3d8bcf; }
      .mark span:nth-child(3) { height: 20px; background: #6fb25a; }
      .icon { display: grid; width: 48px; height: 48px; margin: 0 auto 14px; place-items: center; border-radius: 14px; color: #a06a20; background: #fff5e2; font-size: 22px; }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.02em; }
      p { margin: 0; color: #7f8ea0; font-size: 12px; line-height: 1.7; }
      strong { color: #4f6580; }
      a { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; margin-top: 20px; padding: 0 16px; border-radius: 8px; color: #fff; background: #2f6fae; font-size: 11px; font-weight: 700; text-decoration: none; }
      small { display: block; margin-top: 14px; color: #9aa7b6; font-size: 9px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true"><span></span><span></span><span></span></span>
        RADAR MBG
      </div>
      <div class="icon" aria-hidden="true">!</div>
      <h1>Tidak ada koneksi</h1>
      <p>
        Perangkat sedang offline. <strong>Aksi lapangan belum tersimpan otomatis.</strong>
        Sambungkan internet sebelum memulai trip, mengirim GPS, verifikasi kedatangan, atau mengirim POD.
      </p>
      <a href="/">Muat ulang aplikasi</a>
      <small>Antrean offline dan sinkronisasi otomatis belum tersedia pada versi ini.</small>
    </main>
  </body>
</html>
