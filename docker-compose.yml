services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar_mbg
      POSTGRES_USER: radar_dev
      POSTGRES_PASSWORD: radar_local_only
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - radar-mbg-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_dev -d radar_mbg"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: radar_minio
      MINIO_ROOT_PASSWORD: radar_minio_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - radar-mbg-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 radar_minio radar_minio_local_only
        mc mb --ignore-existing local/radar-mbg-pod
        mc anonymous set none local/radar-mbg-pod

volumes:
  radar-mbg-postgres:
  radar-mbg-minio:
